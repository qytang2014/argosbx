        <div class="row"><label>节点域名 <span class="pill">ym</span></label><input id="ym" type="text" placeholder="填域名后各协议地址优先用该域名（TLS 仍按证书就绪切换；Reality 域名 reym 会自动同步，reym 留空则默认 apple.com），留空则用 IP"/></div>
        <div class="row"><label>伪装博客 <span class="pill">camouflage</span></label>
          <select id="camouflage">
            <option value="">默认（webroot 无 index.html 时自动部署）</option>
            <option value="1">强制部署（覆盖 webroot 现有文件）</option>
            <option value="0">不部署</option>
          </select>
        </div>
        <div class="row"><label>证书验证方式 <span class="pill">certmode</span></label>
          <select id="certmode">
            <option value="">默认 自动（未代理用 HTTP，已代理/Argo 用 DNS）</option>
            <option value="http">HTTP 验证（需 80 端口空闲）</option>
            <option value="webroot">Webroot 验证（nginx 已占 80 端口时用，需配 /.well-known/ location）</option>
            <option value="dns">DNS 验证（需 Cloudflare API Token）</option>
          </select>
        </div>
        <div class="row"><label>证书来源 <span class="pill">certsrc</span></label>
          <select id="certsrc">
            <option value="">默认 自动（低内存走 acme，否则走 Caddy）</option>
            <option value="caddy">Caddy（需反代、内存够）</option>
            <option value="acme">acme.sh（低内存、只要证书）</option>
          </select>
        </div>
        <div class="row"><label>ACME 邮箱 <span class="pill">caddy_email</span></label>
          <input id="caddy_email" placeholder="可选，用于 Let's Encrypt 过期提醒">
        </div>
        <div class="row"><label>反代后端 <span class="pill">web_proxy</span></label>
          <input id="web_proxy" type="text" placeholder="留空则直接读文件；填 127.0.0.1:端口 反代到本地服务（如 Docker）"/>
          <div class="field-note">填了就反代到指定后端（如 Docker 里的网站），不填则 Caddy/Nginx 直接读 webroot 的静态文件。</div>
        </div>
