        <div class="row"><label>节点域名 <span class="pill">ym</span></label><input id="ym" type="text" placeholder="填域名后各协议地址优先用该域名（TLS 仍按证书就绪切换，Reality SNI 仍用 reym），留空则用 IP"/></div>
        <div class="row"><label>Vless-tcp-reality 内核 <span class="pill">vlpt_kernel</span></label>
          <select id="vlpt_kernel">
            <option value="">默认 自动（只剩 Sing-box 时走 Sing-box，否则 Xray；旧安装下次更新即迁移，链接会变）</option>
            <option value="xray">强制 Xray（明确选 Xray 时不迁移，旧链接保留）</option>
            <option value="sb">强制 Sing-box</option>
          </select>
        </div>
        <div class="row"><label>证书验证方式 <span class="pill">certmode</span></label>
          <select id="certmode">
            <option value="">默认 自动（未代理用 HTTP，已代理/Argo 用 DNS）</option>
            <option value="http">HTTP 验证（Caddy 监听 80/443）</option>
            <option value="dns">DNS 验证（需 Cloudflare API + DNS 插件 Caddy）</option>
          </select>
        </div>
        <div class="row"><label>证书来源 <span class="pill">certsrc</span></label>
          <select id="certsrc">
            <option value="">默认 自动（低内存走 acme，否则走 Caddy）</option>
            <option value="caddy">Caddy（需反代、内存够）</option>
            <option value="acme">acme.sh（低内存、只要证书）</option>
          </select>
        </div>
