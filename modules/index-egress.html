        <div class="row"><label>外部出口节点 <span class="pill">egress_nodes</span></label><textarea id="egress_nodes" rows="4" placeholder="一行一个链接，数量不限，#名字就是分流规则 =&gt; 后面要填的出口名（名字里的空格会变成 -，没写 #名字时自动编 vless1/socks1……不稳定，建议都写 #名字）；例：socks5://用户:密码@地址:端口#名字&#10;vless://uuid@地址:443?security=reality&pbk=公钥&sid=短id&sni=域名&fp=chrome&flow=xtls-rprx-vision&type=tcp|ws|grpc|xhttp#名字&#10;trojan://密码@地址:443?sni=域名&type=ws#名字&#10;vmess://uuid@地址:443?security=tls&sni=域名&type=ws#名字（仅 URL 形式，不支持 base64 链接）&#10;ss://加密方式:密码@地址:端口#名字"></textarea></div>
        <div class="row"><label>本机出口 IP <span class="pill">egress_bind</span></label><input id="egress_bind" type="text" placeholder="逗号分隔，例：1.2.3.4,2001:db8::2；自动生成 bind1、bind2……"/></div>
        <div class="row"><label>分流规则 <span class="pill">egress_rules</span></label><textarea id="egress_rules" rows="8" placeholder="一行一条，格式：类型:值=&gt;出口；=&gt;后面只能是出口名，不能是 IP：外部节点填上面链接 #后面的名字（#名字里的空格会变成 -），本机 IP 填 bind1/bind2，内置填 direct/warp-out；规则按行顺序、第一条匹配优先；同一字段逗号是或，不同规则之间是或；&amp; 连多个条件是与；例（节点1/节点2须是上面 #名字）：&#10;domain:example.com=&gt;节点1&#10;ip:1.2.3.0/24=&gt;节点2&#10;source:10.0.0.0/8=&gt;bind1&#10;inbound:vlpt=&gt;节点1（inbound 后直接填协议名 vlpt/xhpt/vxpt/vwpt/xupt/xcpt/nvpt/tupt/anpt/arpt/sspt/hypt/vmpt/vmtls/sopt，不用填入站 tag；旧 tag 如 reality-vision 仍可用）&#10;inbound:vlpt&amp;domain:google.com=&gt;节点1（与：只有 vlpt 来的 google 才走节点1，其他入站的 google 不走这条）&#10;geoip:cn,us=&gt;节点1（国家代码小写，private=内网；有 geo 规则时自动下载数据库）&#10;geosite:google=&gt;节点1（分类名小写，如 google、youtube、cn；有 geo 规则时自动下载数据库）&#10;port:80,443=&gt;bind1&#10;protocol:http,tls=&gt;bind1（需入站开启嗅探）"></textarea></div>
        <div class="row"><label>追加出口节点 <span class="pill">egress_add</span></label><textarea id="egress_add" rows="2" placeholder="增量专用：一行一个链接，只追加、不替换已有 egress_nodes，已有的不会重复加；增量更新时填这里，不要重填 egress_nodes；全量安装时填这里也会追加到 egress_nodes 后面"></textarea></div>
